<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả và báo cáo · NeuroTriage</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#4CC3E0}a:hover{color:#8DDCEE}
.app{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#E7EDF4;background:#0B0F14;font-size:14px;line-height:1.45;min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:1 1 236px;background:#0F141B;border-right:1px solid #1F2935;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8796AA;padding:14px 12px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#A9B6C7;text-decoration:none;font-size:13.5px;min-height:24px}
.nav:hover{background:#18202A;color:#E7EDF4}
.nav.on{background:#14313B;color:#E7EDF4;font-weight:600}
.num{font-size:11px;color:#8796AA;min-width:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid #1F2935;background:#0F141B}
.body{padding:24px 28px 40px;display:flex;flex-direction:column;gap:20px}
.card{background:#121820;border:1px solid #1F2935;border-radius:12px;padding:18px;min-width:0}
.h{font-size:14px;font-weight:600;color:#E7EDF4;margin:0 0 12px}
.lbl{font-size:12px;color:#93A3B8}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.red{background:#3A1719;color:#FF8A8A}.amb{background:#3A2C10;color:#F7C25E}.grn{background:#0F3020;color:#5FD39A}.blu{background:#10303A;color:#6FD3EA}.gry{background:#1E2733;color:#B4C0CF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #2A3646;background:#18202A;color:#E7EDF4;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#202B38;color:#E7EDF4}
.btn.pri{background:#4CC3E0;border-color:#4CC3E0;color:#06232B}
.in{width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:8px;border:1px solid #2A3646;background:#0E141B;color:#E7EDF4;font:inherit;line-height:1.55}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#93A3B8;font-weight:600}
.ai{background:#10262E;border:1px dashed #2C6E80;border-radius:4px;padding:0 4px}
.paper{background:#0E141B;border:1px solid #1F2935;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div class="app">
<aside class="side" aria-label="Phân hệ">
<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 14px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#4CC3E0"></rect><path d="M7 17h5l2.5-6 3.5 11 2.5-5H25" stroke="#06232B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div><div style="font-weight:700;font-size:15px">NeuroTriage</div><div class="lbl">AI hỗ trợ chấn thương sọ não</div></div>
</div>
<nav style="display:flex;flex-direction:column;gap:2px">
<template data-sc="for" list="{{nav}}" as="n" hint-placeholder-count="20">
<template data-sc="if" value="{{n.head}}" hint-placeholder-val="{{false}}"><div class="grp">{{n.t}}</div></template>
<template data-sc="if" value="{{n.link}}" hint-placeholder-val="{{true}}"><a class="nav {{n.cls}}" href="{{n.href}}" aria-current="{{n.cur}}"><span class="mono num">{{n.num}}</span>{{n.t}}</a></template>
</template>
</nav>
</aside>
<main class="main">
<header class="top">
<div style="flex:1 1 320px;min-width:0"><div class="lbl">Lâm sàng · 06 · CT-2611-0142 · Accession ACC-8821930</div><h1 style="margin:2px 0 0;font-size:20px;font-weight:700">Kết quả chẩn đoán hình ảnh</h1></div>
<span class="chip amb">Dữ liệu mô phỏng</span>
<span class="chip {{stCls}}">{{stText}}</span>
<button type="button" class="btn">Lưu nháp</button>
<button type="button" class="btn pri" onClick="{{sign}}">{{signText}}</button>
</header>
<div class="body">
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
<section class="card" style="flex:999 1 600px;min-width:0">
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
<h2 class="h" style="margin:0;flex:1">Báo cáo có cấu trúc</h2>
<label class="lbl" for="tpl">Mẫu</label>
<select id="tpl" class="in" style="width:auto;min-width:260px"><option>CT sọ não chấn thương · người lớn</option><option>CT sọ não chấn thương · trẻ em</option><option>X-quang sọ thẳng nghiêng</option></select>
</div>
<div class="paper">
<div class="sec"><h3>Kỹ thuật</h3><div>Chụp CT sọ não không tiêm thuốc cản quang, lát cắt 5 mm, tái tạo xương 0,625 mm. Máy [Hãng máy CT] 16 dãy, TTYT khu vực [A].</div></div>
<div class="sec"><h3>Lâm sàng</h3><div>Nam 34 tuổi, tai nạn xe máy lúc 17:40. GCS 14 (E4 V4 M6), nôn 2 lần, có uống rượu bia. Phân tầng T1: Vàng.</div></div>
<div class="sec"><h3>Mô tả</h3>
<div>Khối tăng tỷ trọng hình liềm sát vòm sọ bán cầu trái, <span class="ai">dày tối đa 14 mm, thể tích ước tính 38 ml</span>, trải dài từ trán đến đỉnh. Đè đẩy não thất bên trái, <span class="ai">đường giữa lệch sang phải 6,2 mm</span>. Rãnh cuộn não bán cầu trái bị xóa. Bể đáy còn thấy. <span class="ai">Nghi ít máu dưới nhện rãnh Sylvius phải</span> (độ tin cậy thấp, cần đối chiếu). Không thấy đường vỡ xương trên cửa sổ xương.</div>
</div>
<div class="sec"><h3>Kết luận</h3><div style="font-weight:600">Máu tụ dưới màng cứng cấp bán cầu trái gây hiệu ứng khối, lệch đường giữa 6,2 mm. Theo dõi xuất huyết dưới nhện lượng ít.</div></div>
<div class="sec"><h3>Phân loại & mức nguy cơ</h3><div style="display:flex;flex-wrap:wrap;gap:8px"><span class="chip red">ĐỎ · nguy cơ cao</span><span class="chip gry">ICD-10 S06.5</span><span class="chip gry">Marshall III (đề xuất)</span></div></div>
<div class="sec"><h3>Khuyến nghị</h3><div>Hội chẩn ngoại thần kinh khẩn, chuyển tuyến có khả năng phẫu thuật. Theo dõi GCS và đồng tử mỗi 15 phút trong lúc vận chuyển.</div></div>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding-top:14px;border-top:1px solid #1F2935">
<div class="lbl" style="flex:1 1 260px">Phần có khung nét đứt là số đo AI gợi ý. Bác sĩ có thể sửa trực tiếp, mỗi thay đổi được lưu lại làm nhãn phản hồi.</div>
<div style="text-align:right"><div class="lbl">Bác sĩ đọc</div><div style="font-weight:600">BS. [Họ tên] · CĐHA</div><div class="mono lbl">{{signedAt}}</div></div>
</div>
</div>
</section>
<aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px">
<section class="card">
<h2 class="h">Ảnh chính đính kèm</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<div style="aspect-ratio:1/1;background:#000;border-radius:8px;overflow:hidden">
<svg viewBox="0 0 400 400" role="img" aria-label="Ảnh khóa: lát 18 có máu tụ được tô màu" style="width:100%;height:100%;display:block"><ellipse cx="200" cy="205" rx="150" ry="178" fill="#151515" stroke="#ECECEC" stroke-width="13"></ellipse><ellipse cx="200" cy="205" rx="138" ry="166" fill="#6a6a6a"></ellipse><path d="M190 150 C172 172 174 212 192 240 L200 236 C188 210 188 176 200 156 Z" fill="#2a2a2a"></path><path d="M226 148 C250 168 252 214 232 244 L220 238 C236 210 236 176 218 154 Z" fill="#2a2a2a"></path><path d="M90 80 Q48 205 92 330 Q74 205 104 86 Z" fill="#F26B6B" fill-opacity=".6"></path><line x1="200" y1="40" x2="200" y2="370" stroke="#4CC3E0" stroke-width="2" stroke-dasharray="6 5"></line></svg>
</div>
<div style="aspect-ratio:1/1;background:#000;border-radius:8px;overflow:hidden">
<svg viewBox="0 0 400 400" role="img" aria-label="Ảnh khóa: cửa sổ xương, không thấy vỡ" style="width:100%;height:100%;display:block"><ellipse cx="200" cy="205" rx="150" ry="178" fill="#0b0b0b" stroke="#F5F5F5" stroke-width="15"></ellipse><ellipse cx="200" cy="205" rx="138" ry="166" fill="#1b1b1b"></ellipse></svg>
</div>
</div>
<div class="lbl" style="margin-top:8px">Lát 18 (máu tụ, đường giữa) · Lát 20 cửa sổ xương</div>
</section>
<section class="card">
<h2 class="h">Khác biệt giữa AI và bác sĩ</h2>
<div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
<div style="display:flex;gap:8px"><span class="chip grn">Giữ</span><span>Máu tụ dưới màng cứng trái, 38 ml</span></div>
<div style="display:flex;gap:8px"><span class="chip grn">Giữ</span><span>Lệch đường giữa 6,2 mm</span></div>
<div style="display:flex;gap:8px"><span class="chip amb">Sửa</span><span>XH dưới nhện: AI đặt ở lát 26–28 bên trái; BS ghi rãnh Sylvius phải</span></div>
<div style="display:flex;gap:8px"><span class="chip blu">Thêm</span><span>Xóa rãnh cuộn não bán cầu trái</span></div>
</div>
<p class="lbl" style="margin:12px 0 0">Các khác biệt tự động chuyển sang AI Studio làm nhãn mới, chờ duyệt.</p>
</section>
<section class="card">
<h2 class="h">Trả kết quả về HIS</h2>
<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
<template data-sc="for" list="{{steps}}" as="s" hint-placeholder-count="4">
<li style="display:flex;gap:10px;align-items:flex-start"><span class="dot" style="background:{{s.c}};width:12px;height:12px;margin-top:4px"></span><div style="flex:1"><div style="font-size:13.5px;font-weight:600">{{s.t}}</div><div class="lbl mono">{{s.d}}</div></div></li>
</template>
</ol>
</section>
<section class="card">
<h2 class="h">Văn bản cho bệnh nhân và tuyến dưới</h2>
<p style="margin:0;font-size:13px">Bản tóm tắt dễ hiểu được sinh từ mẫu cố định. Mô hình ngôn ngữ chỉ dùng để diễn đạt câu chữ, không dùng để đọc ảnh.</p>
<button type="button" class="btn" style="margin-top:12px;width:100%">Xem bản tóm tắt</button>
</section>
</aside>
</div>
</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false }; }
  navVals(cur) {
    const N = [['h','Lâm sàng'],['01','Tổng quan','Main'],['02','Tiếp nhận & sàng lọc','Intake'],['03','Danh sách ca đọc','Worklist'],['04','Đọc phim DICOM','Viewer'],['05','Phân tầng nguy cơ AI','Risk'],['06','Kết quả & báo cáo','Report'],['h','Phối hợp tuyến'],['07','Hội chẩn từ xa','Consult'],['08','Chuyển tuyến','Referral'],['09','Liên thông HIS/PACS','Integration'],['09b','Cấu hình liên thông','IntegrationConfig'],['10','Cảnh báo & trực','Alerts'],['h','Quản lý'],['11','Thống kê & chất lượng','Analytics'],['12','Quản trị hệ thống','Admin'],['h','AI Studio'],['13a','Dữ liệu & gán nhãn','Labeling'],['13b','Huấn luyện & đánh giá','Training'],['13c','Cấu hình mô hình AI','ModelConfig']];
    return N.map(n => n[0] === 'h' ? { head: true, link: false, t: n[1] } : { head: false, link: true, num: n[0], t: n[1], href: n[2] + '.html', cls: n[2] === cur ? 'on' : '', cur: n[2] === cur ? 'page' : undefined });
  }
  renderVals() {
    const sent = this.state.sent;
    const ok = '#3FBF7F', wait = '#3A4757';
    return {
      nav: this.navVals('Report'),
      sign: () => this.setState({ sent: !this.state.sent }),
      signText: sent ? 'Hủy ký (demo)' : 'Ký số & gửi HIS',
      stText: sent ? 'Đã ký · đã gửi' : 'Bản nháp',
      stCls: sent ? 'grn' : 'gry',
      signedAt: sent ? 'Ký lúc 19:52 · chứng thư số cá nhân' : 'Chưa ký',
      steps: [
        { t: 'Ký số báo cáo', d: sent ? 'Hoàn tất · 19:52:07' : 'Chờ bác sĩ ký', c: sent ? ok : '#F2B33D' },
        { t: 'Tạo DiagnosticReport (FHIR R4)', d: sent ? 'DR-552901 · kèm ImagingStudy' : '—', c: sent ? ok : wait },
        { t: 'Gửi HL7 v2 ORU^R01 cho HIS cũ', d: sent ? 'ACK AA · 340 ms' : '—', c: sent ? ok : wait },
        { t: 'Lưu ảnh khóa và lớp phủ AI vào PACS', d: sent ? 'DICOM SR + SEG · STOW-RS' : '—', c: sent ? ok : wait }
      ]
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
