<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cấu hình liên thông · NeuroTriage</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#4CC3E0}a:hover{color:#8DDCEE}
.app{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#E7EDF4;background:#0B0F14;font-size:14px;line-height:1.45;min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:1 1 236px;background:#0F141B;border-right:1px solid #1F2935;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8796AA;padding:14px 12px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#A9B6C7;text-decoration:none;font-size:13.5px;min-height:24px}
.nav:hover{background:#18202A;color:#E7EDF4}
.nav.on{background:#14313B;color:#E7EDF4;font-weight:600}
.num{font-size:11px;color:#8796AA;min-width:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid #1F2935;background:#0F141B}
.card{background:#121820;border:1px solid #1F2935;border-radius:12px;padding:18px;min-width:0}
.h{font-size:14px;font-weight:600;color:#E7EDF4;margin:0 0 12px}
.lbl{font-size:12px;color:#93A3B8}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.red{background:#3A1719;color:#FF8A8A}.amb{background:#3A2C10;color:#F7C25E}.grn{background:#0F3020;color:#5FD39A}.blu{background:#10303A;color:#6FD3EA}.gry{background:#1E2733;color:#B4C0CF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #2A3646;background:#18202A;color:#E7EDF4;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#202B38;color:#E7EDF4}
.btn.pri{background:#4CC3E0;border-color:#4CC3E0;color:#06232B}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px}
.in{width:100%;box-sizing:border-box;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid #2A3646;background:#0E141B;color:#E7EDF4;font:inherit;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tab{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:#A9B6C7;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.tab.sel{background:#14313B;border-color:#24505E;color:#E7EDF4}
.fld{display:flex;flex-direction:column;gap:4px}
.cn{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;border:1px solid #1F2935;background:#0E141B;color:#E7EDF4;text-align:left;font:inherit;cursor:pointer;width:100%}
.cn.sel{border-color:#4CC3E0;background:#10262E}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:#93A3B8;font-size:12px;padding:8px 10px;border-bottom:1px solid #1F2935;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #18202A;vertical-align:middle}
.scroll{overflow-x:auto}
.code{font-family:'JetBrains Mono',monospace;font-size:12px;background:#0A0E13;border:1px solid #1F2935;border-radius:8px;padding:12px;white-space:pre-wrap;color:#C9D4E1;margin:0;overflow-x:auto}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid #2A3646;background:#0E141B;cursor:pointer}
.opt.sel{border-color:#4CC3E0;background:#10262E}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:#4CC3E0}
.cb{width:18px;height:18px;margin:0;accent-color:#4CC3E0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div class="app">
<aside class="side" aria-label="Phân hệ">
<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 14px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#4CC3E0"></rect><path d="M7 17h5l2.5-6 3.5 11 2.5-5H25" stroke="#06232B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div><div style="font-weight:700;font-size:15px">NeuroTriage</div><div class="lbl">AI hỗ trợ chấn thương sọ não</div></div>
</div>
<nav style="display:flex;flex-direction:column;gap:2px">
<template data-sc="for" list="{{nav}}" as="n" hint-placeholder-count="20">
<template data-sc="if" value="{{n.head}}" hint-placeholder-val="{{false}}"><div class="grp">{{n.t}}</div></template>
<template data-sc="if" value="{{n.link}}" hint-placeholder-val="{{true}}"><a class="nav {{n.cls}}" href="{{n.href}}" aria-current="{{n.cur}}"><span class="mono num">{{n.num}}</span>{{n.t}}</a></template>
</template>
</nav>
</aside>
<main class="main">
<header class="top">
<div style="flex:1 1 320px;min-width:0"><div class="lbl">Phối hợp tuyến · 09b</div><h1 style="margin:2px 0 0;font-size:20px;font-weight:700">Cấu hình liên thông · {{cName}}</h1></div>
<span class="chip amb">Dữ liệu mô phỏng</span>
<a class="btn" href="Integration.html">Về bảng giám sát</a>
<button type="button" class="btn" onClick="{{test}}">Kiểm tra kết nối</button>
<button type="button" class="btn pri" onClick="{{save}}">Lưu cấu hình</button>
</header>
<template data-sc="if" value="{{toast}}" hint-placeholder-val="{{false}}"><div role="status" style="margin:14px 24px 0;padding:10px 14px;border-radius:8px;background:{{toastBg}};color:{{toastC}};font-size:13px">{{toast}}</div></template>
<div style="display:flex;flex-wrap:wrap;gap:18px;padding:18px 24px 40px;align-items:flex-start">
<nav style="flex:1 1 240px;max-width:290px;display:flex;flex-direction:column;gap:8px" aria-label="Danh sách kết nối">
<div class="lbl" style="font-weight:600">Kết nối ({{cCount}})</div>
<template data-sc="for" list="{{conns}}" as="c" hint-placeholder-count="7">
<button type="button" class="cn {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.sel}}">
<span style="display:flex;align-items:center;gap:8px;width:100%"><span class="dot" style="background:{{c.dc}}"></span><span style="font-weight:600;font-size:13.5px;flex:1">{{c.n}}</span></span>
<span class="mono lbl">{{c.p}}</span>
</button>
</template>
<button type="button" class="btn">+ Thêm kết nối</button>
</nav>
<section class="card" style="flex:999 1 560px;min-width:0;padding:0">
<div style="display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid #1F2935" role="tablist" aria-label="Mục cấu hình">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" role="tab" class="tab {{t.cls}}" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.t}}</button></template>
</div>
<div style="padding:18px;display:flex;flex-direction:column;gap:16px">
<template data-sc="if" value="{{tab0}}" hint-placeholder-val="{{true}}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<label class="fld"><span class="lbl">Tên kết nối</span><input class="in" value="{{cName}}" onChange="{{noop}}"></label>
<label class="fld"><span class="lbl">Loại giao thức</span><select class="in" onChange="{{onType}}"><template data-sc="for" list="{{types}}" as="t" hint-placeholder-count="6"><option value="{{t.v}}" selected="{{t.sel}}">{{t.t}}</option></template></select></label>
<label class="fld"><span class="lbl">Chiều dữ liệu</span><select class="in"><option>Hai chiều</option><option>Chỉ nhận vào</option><option>Chỉ gửi đi</option></select></label>
<label class="fld"><span class="lbl">Cơ sở áp dụng</span><select class="in"><option>{{cSite}}</option><option>Tất cả cơ sở trong cụm</option></select></label>
</div>
<template data-sc="if" value="{{isHl7}}" hint-placeholder-val="{{false}}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<label class="fld"><span class="lbl">Máy chủ (host)</span><input class="in mono" placeholder="10.2.1.20"></label>
<label class="fld"><span class="lbl">Cổng MLLP</span><input class="in mono" placeholder="2575"></label>
<label class="fld"><span class="lbl">Phiên bản HL7</span><select class="in"><option>2.5.1</option><option>2.3.1</option><option>2.4</option></select></label>
<label class="fld"><span class="lbl">Bảng mã</span><select class="in"><option>UTF-8</option><option>TCVN3 (chuyển đổi)</option></select></label>
<label class="fld"><span class="lbl">Ứng dụng gửi (MSH-3)</span><input class="in mono" placeholder="HIS_TTYT_A"></label>
<label class="fld"><span class="lbl">Ứng dụng nhận (MSH-5)</span><input class="in mono" placeholder="NEUROTRIAGE"></label>
</div>
</template>
<template data-sc="if" value="{{isFhir}}" hint-placeholder-val="{{false}}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<label class="fld"><span class="lbl">FHIR base URL</span><input class="in mono" placeholder="https://his.[bv].vn/fhir/R4"></label>
<label class="fld"><span class="lbl">Phiên bản</span><select class="in"><option>R4 (4.0.1)</option><option>R5</option></select></label>
<label class="fld"><span class="lbl">Cách nhận chỉ định</span><select class="in"><option>Subscription (rest-hook)</option><option>Polling mỗi 30 giây</option></select></label>
<label class="fld"><span class="lbl">Tài nguyên trả kết quả</span><select class="in"><option>DiagnosticReport + RiskAssessment</option><option>Chỉ DiagnosticReport</option></select></label>
</div>
<div class="fld"><span class="lbl">Mở trong ngữ cảnh (SMART on FHIR launch)</span><input class="in mono" placeholder="https://[máy-chủ]/launch?iss={FHIR_BASE}&amp;launch={LAUNCH_ID}"></div>
</template>
<template data-sc="if" value="{{isDicom}}" hint-placeholder-val="{{false}}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<label class="fld"><span class="lbl">AE Title của PACS</span><input class="in mono" placeholder="PACS_TINH"></label>
<label class="fld"><span class="lbl">AE Title của NeuroTriage</span><input class="in mono" placeholder="NT_AI_GW"></label>
<label class="fld"><span class="lbl">Host · cổng DIMSE</span><input class="in mono" placeholder="10.2.1.30 : 104"></label>
<label class="fld"><span class="lbl">DICOMweb base URL</span><input class="in mono" placeholder="https://pacs.[bv].vn/dicom-web"></label>
<label class="fld"><span class="lbl">Bộ lọc nhận ảnh</span><select class="in"><option>Modality CT, X-quang · vùng đầu</option><option>Tất cả</option></select></label>
<label class="fld"><span class="lbl">Nén khi truyền</span><select class="in"><option>JPEG 2000 lossless</option><option>Không nén</option></select></label>
</div>
</template>
<template data-sc="if" value="{{isRest}}" hint-placeholder-val="{{false}}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<label class="fld"><span class="lbl">Base URL của hệ thống đối tác</span><input class="in mono" placeholder="https://api.[đối-tác].vn/v1"></label>
<label class="fld"><span class="lbl">Định dạng</span><select class="in"><option>JSON</option><option>XML</option></select></label>
<label class="fld"><span class="lbl">Đồng bộ ngoại tuyến</span><select class="in"><option>Có · hàng đợi trên máy trạm</option><option>Không</option></select></label>
</div>
</template>
<h3 class="h" style="margin:4px 0 0">Độ tin cậy</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
<label class="fld"><span class="lbl">Thời gian chờ (giây)</span><input class="in mono" type="number" value="30"></label>
<label class="fld"><span class="lbl">Số lần thử lại</span><input class="in mono" type="number" value="5"></label>
<label class="fld"><span class="lbl">Giãn cách thử lại</span><select class="in"><option>Lũy thừa: 2s, 4s, 8s…</option><option>Cố định 10s</option></select></label>
<label class="fld"><span class="lbl">Bản tin lỗi sau cùng</span><select class="in"><option>Đưa vào hàng chờ xử lý tay (DLQ)</option><option>Bỏ qua + cảnh báo</option></select></label>
</div>
</template>
<template data-sc="if" value="{{tab1}}" hint-placeholder-val="{{false}}">
<div class="lbl">Ánh xạ trường dữ liệu đến mô hình nội bộ. Trường định danh cá nhân được băm hoặc thay bằng mã giả trước khi lưu ở vùng nghiên cứu.</div>
<div class="scroll"><table>
<thead><tr><th>Nguồn ({{srcKind}})</th><th>Trường nội bộ</th><th>Biến đổi</th><th>Bắt buộc</th></tr></thead>
<tbody>
<template data-sc="for" list="{{maps}}" as="m" hint-placeholder-count="8"><tr><td class="mono" style="font-size:12px">{{m.a}}</td><td class="mono" style="font-size:12px">{{m.b}}</td><td><span class="chip {{m.cls}}">{{m.t}}</span></td><td><input class="cb" type="checkbox" aria-label="Bắt buộc {{m.b}}" checked="{{m.req}}" onChange="{{noop}}"></td></tr></template>
</tbody></table></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm">+ Thêm ánh xạ</button><button type="button" class="btn sm">Nhập từ file CSV</button><a class="btn sm" href="Integration.html">Ánh xạ mã dịch vụ</a></div>
</template>
<template data-sc="if" value="{{tab2}}" hint-placeholder-val="{{false}}">
<div class="fld"><span class="lbl">Phương thức xác thực</span>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px" role="radiogroup" aria-label="Xác thực">
<template data-sc="for" list="{{auths}}" as="a" hint-placeholder-count="4"><label class="opt {{a.cls}}"><input type="radio" name="auth" checked="{{a.sel}}" onChange="{{a.pick}}"><span><span style="font-weight:600;font-size:13.5px">{{a.t}}</span><br><span class="lbl">{{a.d}}</span></span></label></template>
</div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<label class="fld"><span class="lbl">Danh sách IP cho phép</span><input class="in mono" placeholder="10.2.0.0/16, 10.9.1.4"></label>
<label class="fld"><span class="lbl">Chứng thư máy khách (mTLS)</span><input class="in" type="file"></label>
<label class="fld"><span class="lbl">Khóa bí mật lưu tại</span><select class="in"><option>HashiCorp Vault · secret/integration/{{cId}}</option></select></label>
<label class="fld"><span class="lbl">Hồ sơ ẩn danh DICOM</span><select class="in"><option>PS3.15 Basic Profile + giữ UID đã ánh xạ</option><option>Không ẩn danh (chỉ nội bộ bệnh viện)</option></select></label>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label style="display:flex;gap:10px;align-items:center;font-size:13px"><input class="cb" type="checkbox" checked="{{t1}}" onChange="{{tg1}}">Bắt buộc TLS 1.3</label>
<label style="display:flex;gap:10px;align-items:center;font-size:13px"><input class="cb" type="checkbox" checked="{{t2}}" onChange="{{tg2}}">Ghi toàn bộ nội dung bản tin vào nhật ký (chỉ khi gỡ lỗi, tự tắt sau 24 giờ)</label>
</div>
</template>
<template data-sc="if" value="{{tab3}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-wrap:wrap;gap:16px">
<div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px">
<label class="fld"><span class="lbl">Bản tin mẫu</span><textarea class="in mono" rows="9" style="font-size:12px;resize:vertical" value="{{sample}}" onChange="{{onSample}}"></textarea></label>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" onClick="{{runTest}}">Gửi thử vào môi trường kiểm thử</button><button type="button" class="btn" onClick="{{resetSample}}">Mẫu mặc định</button></div>
</div>
<div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px">
<div class="lbl">Kết quả phân tích</div>
<pre class="code">{{result}}</pre>
</div>
</div>
</template>
<template data-sc="if" value="{{tab4}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><h3 class="h" style="margin:0;flex:1">Ứng dụng bên ngoài được cấp quyền gọi API</h3><button type="button" class="btn sm" onClick="{{newClient}}">+ Cấp client mới</button></div>
<div class="scroll"><table>
<thead><tr><th>Client ID</th><th>Hệ thống</th><th>Phạm vi (scopes)</th><th>Giới hạn</th><th>Dùng lần cuối</th><th>Trạng thái</th><th></th></tr></thead>
<tbody>
<template data-sc="for" list="{{clients}}" as="c" hint-placeholder-count="4"><tr><td class="mono" style="font-size:12px">{{c.id}}</td><td>{{c.sys}}</td><td class="mono" style="font-size:11.5px">{{c.sc}}</td><td class="mono">{{c.rl}}</td><td class="mono lbl">{{c.last}}</td><td><span class="chip {{c.cls}}">{{c.st}}</span></td><td><button type="button" class="btn sm" onClick="{{c.tg}}">{{c.btn}}</button></td></tr></template>
</tbody></table></div>
<h3 class="h" style="margin:8px 0 0">Webhook gửi sự kiện</h3>
<div class="scroll"><table>
<thead><tr><th>URL nhận</th><th>Sự kiện</th><th>Ký HMAC</th><th>Tỉ lệ thành công 7 ngày</th></tr></thead>
<tbody>
<tr><td class="mono" style="font-size:12px">https://his.[bv].vn/hooks/neuro</td><td class="mono" style="font-size:11.5px">report.signed, risk.updated</td><td><span class="chip grn">SHA-256</span></td><td class="mono">99,8%</td></tr>
<tr><td class="mono" style="font-size:12px">https://hoichan.[tuyen-cuoi].vn/api/cases</td><td class="mono" style="font-size:11.5px">consult.requested, referral.updated</td><td><span class="chip grn">SHA-256</span></td><td class="mono">100%</td></tr>
<tr><td class="mono" style="font-size:12px">https://baocao.[so-y-te].vn/ingest</td><td class="mono" style="font-size:11.5px">stats.daily</td><td><span class="chip grn">SHA-256</span></td><td class="mono">97,1%</td></tr>
</tbody></table></div>
<div class="lbl">Tài liệu đầy đủ: docs/api/openapi.yaml (OpenAPI 3.1) và docs/api/API.md trong gói bàn giao.</div>
</template>
</div>
</section>
</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: 1, tab: 0, auth: 0, t1: true, t2: false, sample: '', result: 'Chưa chạy.', toast: '', toastOk: true, revoked: {}, extra: 0, typeOver: {} }; }
  navVals(cur) {
    const N = [['h','Lâm sàng'],['01','Tổng quan','Main'],['02','Tiếp nhận & sàng lọc','Intake'],['03','Danh sách ca đọc','Worklist'],['04','Đọc phim DICOM','Viewer'],['05','Phân tầng nguy cơ AI','Risk'],['06','Kết quả & báo cáo','Report'],['h','Phối hợp tuyến'],['07','Hội chẩn từ xa','Consult'],['08','Chuyển tuyến','Referral'],['09','Liên thông HIS/PACS','Integration'],['09b','Cấu hình liên thông','IntegrationConfig'],['10','Cảnh báo & trực','Alerts'],['h','Quản lý'],['11','Thống kê & chất lượng','Analytics'],['12','Quản trị hệ thống','Admin'],['h','AI Studio'],['13a','Dữ liệu & gán nhãn','Labeling'],['13b','Huấn luyện & đánh giá','Training'],['13c','Cấu hình mô hình AI','ModelConfig']];
    return N.map(n => n[0] === 'h' ? { head: true, link: false, t: n[1] } : { head: false, link: true, num: n[0], t: n[1], href: n[2] + '.html', cls: n[2] === cur ? 'on' : '', cur: n[2] === cur ? 'page' : undefined });
  }
  samples() {
    return {
      hl7: 'MSH|^~\\&|HIS_TTYT_A|TTYT_A|NEUROTRIAGE|BV_TINH|20261030193802||ORM^O01|MSG000812|P|2.5.1\nPID|1||BN2026104772^^^TTYT_A||TRAN^VAN^A||19920315|M\nPV1|1|E|CAPCUU\nORC|NW|ORD-77812|||SC\nOBR|1|ORD-77812||DV-CT-001^CT so nao khong can quang|||20261030193700||||||||||||ACC-8821930',
